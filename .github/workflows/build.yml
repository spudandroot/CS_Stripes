name: Build

# Every push is tested and built. To publish a release (which PCs pick up via
# deploy/Update-Stripes.ps1), either push a version tag like v1.2.0, or use
# Actions > Build > Run workflow and type the version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. v1.2.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest -v

      - name: Stamp version
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $v = if ($env:RELEASE) { $env:RELEASE }
               elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME }
               else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          if ($env:RELEASE -and $env:RELEASE -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like v1.2.0" }
          "VERSION = `"$v`"" | Out-File -Encoding utf8 stripes_version.py
          "STRIPES_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build Stripes.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Stripes --icon assets\icon.ico --add-data "assets;assets" stripes.py

      - name: Checksum and version files
        shell: pwsh
        run: |
          (Get-FileHash dist\Stripes.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii -NoNewline dist\Stripes.exe.sha256
          $env:STRIPES_VERSION | Out-File -Encoding ascii -NoNewline dist\version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Stripes
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ env.STRIPES_VERSION }}" dist/Stripes.exe dist/Stripes.exe.sha256 dist/version.txt --target "${{ github.sha }}" --title "Stripes ${{ env.STRIPES_VERSION }}" --generate-notes
