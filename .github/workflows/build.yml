name: Build

# Every push is tested and built. To publish a release (which every copy of
# Stripes then updates itself to), either push a version tag like v1.2.0, or use
# Actions > Build > Run workflow and type the version.
#
# A version like v1.4.0-beta.1 is a beta: it's published as a pre-release, and the
# "beta" release (which only holds version.txt) is pointed at it. Only PCs and users
# listed in beta.json follow it. Betas can be run from any branch.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. v1.2.0, or v1.3.0-beta.1 for beta PCs only (empty: just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest -v

      - name: Stamp version
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $v = if ($env:RELEASE) { $env:RELEASE }
               elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME }
               else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          if ($env:RELEASE -and $env:RELEASE -notmatch '^v\d+\.\d+\.\d+(-beta\.\d+)?$') {
            throw "Version must look like v1.2.0 or v1.2.0-beta.1"
          }
          "VERSION = `"$v`"" | Out-File -Encoding utf8 stripes_version.py
          "STRIPES_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build Stripes.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Stripes --icon assets\icon.ico --add-data "assets;assets" stripes.py

      # The same program already unpacked (Stripes.exe + a Stripes-<version> folder), which
      # starts much faster. Copies of Stripes install this; the single exe above is for
      # Group Policy's first copy and for older versions.
      - name: Build Stripes-app.zip
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Stripes --icon assets\icon.ico --add-data "assets;assets" --contents-directory "Stripes-$env:STRIPES_VERSION" --distpath onedir --workpath build-onedir stripes.py
          if ($LASTEXITCODE) { exit 1 }
          python -c "import shutil; shutil.make_archive('dist/Stripes-app', 'zip', 'onedir/Stripes')"

      - name: Check both builds start
        shell: pwsh
        run: |
          Expand-Archive dist\Stripes-app.zip -DestinationPath check-onedir
          foreach ($run in @(@{exe = "dist\Stripes.exe"; layout = "onefile"}, @{exe = "check-onedir\Stripes.exe"; layout = "onedir"})) {
            $out = Join-Path $PWD "check-$($run.layout).txt"
            Start-Process -FilePath $run.exe -ArgumentList "--self-check", "`"$out`"" -Wait
            $got = Get-Content $out -ErrorAction SilentlyContinue
            if ($got -ne "ok $env:STRIPES_VERSION $($run.layout)") { throw "$($run.exe) self-check failed: '$got'" }
            Write-Output "$($run.exe): $got"
          }

      - name: Checksum and version files
        shell: pwsh
        run: |
          foreach ($f in "Stripes.exe", "Stripes-app.zip") {
            (Get-FileHash "dist\$f" -Algorithm SHA256).Hash | Out-File -Encoding ascii -NoNewline "dist\$f.sha256"
          }
          $env:STRIPES_VERSION | Out-File -Encoding ascii -NoNewline dist\version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Stripes
          path: dist/*

      - name: Publish release
        if: (github.ref_type == 'tag' || inputs.release != '') && !contains(env.STRIPES_VERSION, '-beta.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ env.STRIPES_VERSION }}" dist/Stripes.exe dist/Stripes.exe.sha256 dist/Stripes-app.zip dist/Stripes-app.zip.sha256 dist/version.txt --target "${{ github.sha }}" --title "Stripes ${{ env.STRIPES_VERSION }}" --generate-notes --latest

      - name: Publish beta
        if: (github.ref_type == 'tag' || inputs.release != '') && contains(env.STRIPES_VERSION, '-beta.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ env.STRIPES_VERSION }}
        run: |
          gh release create $env:V dist/Stripes.exe dist/Stripes.exe.sha256 dist/Stripes-app.zip dist/Stripes-app.zip.sha256 dist/version.txt --target "${{ github.sha }}" --title "Stripes $env:V" --generate-notes --prerelease
          if ($LASTEXITCODE) { exit 1 }
          # Point the beta channel at it: beta PCs read beta/version.txt, then download from the release above
          gh release view beta *> $null
          if ($LASTEXITCODE) {
            gh release create beta dist/version.txt --target "${{ github.sha }}" --prerelease --title "Beta channel" --notes "Holds the version beta PCs should run. Don't delete."
          } else {
            gh release upload beta dist/version.txt --clobber
          }
          if ($LASTEXITCODE) { exit 1 }
