name: Build

# Every push is tested and built. To publish a release (which every copy of
# Stripes then updates itself to), either push a version tag like v1.2.0, or use
# Actions > Build > Run workflow and type the version.
#
# A version like v1.4.0-beta.1 is a beta: it's published as a pre-release, and the
# "beta" release (which only holds version.txt) is pointed at it. Only PCs and users
# listed in beta.json follow it. Betas can be run from any branch.
#
# Releases are code-signed with Azure Artifact Signing (account ArrowfarmsSigning,
# profile Stripes-Signing). Only the sign job can sign: it runs in the "release"
# environment, whose secrets hold the Azure IDs, and Azure only accepts that environment.
# "Sign only" signs a build without publishing it, to test signing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. v1.2.0, or v1.3.0-beta.1 for beta PCs only (empty: just build)"
        required: false
        default: ""
      sign:
        description: "Sign only (test signing without publishing)"
        type: boolean
        default: false
      latest:
        description: "Make it the latest release, so every PC updates to it (untick to publish without rolling out)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest -v

      - name: Stamp version
        id: stamp
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $v = if ($env:RELEASE) { $env:RELEASE }
               elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME }
               else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          if ($env:RELEASE -and $env:RELEASE -notmatch '^v\d+\.\d+\.\d+(-beta\.\d+)?$') {
            throw "Version must look like v1.2.0 or v1.2.0-beta.1"
          }
          "VERSION = `"$v`"" | Out-File -Encoding utf8 stripes_version.py
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build Stripes.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Stripes --icon assets\icon.ico --add-data "assets;assets" stripes.py

      - uses: actions/upload-artifact@v4
        with:
          name: Stripes-unsigned
          path: dist/Stripes.exe

  sign:
    needs: build
    if: github.ref_type == 'tag' || inputs.release != '' || inputs.sign
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      STRIPES_VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stripes-unsigned
          path: dist

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Stripes.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: ArrowfarmsSigning
          certificate-profile-name: Stripes-Signing
          files: ${{ github.workspace }}\dist\Stripes.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\Stripes.exe
          Write-Output "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "Stripes.exe is not validly signed: $($sig.StatusMessage)" }

      - name: Checksum and version files
        shell: pwsh
        run: |
          (Get-FileHash dist\Stripes.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii -NoNewline dist\Stripes.exe.sha256
          $env:STRIPES_VERSION | Out-File -Encoding ascii -NoNewline dist\version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Stripes-signed
          path: dist/*

      - name: Publish release
        if: (github.ref_type == 'tag' || inputs.release != '') && !contains(env.STRIPES_VERSION, '-beta.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ env.STRIPES_VERSION }}" dist/Stripes.exe dist/Stripes.exe.sha256 dist/version.txt --target "${{ github.sha }}" --title "Stripes ${{ env.STRIPES_VERSION }}" --generate-notes --latest=${{ inputs.latest != false }}

      - name: Publish beta
        if: (github.ref_type == 'tag' || inputs.release != '') && contains(env.STRIPES_VERSION, '-beta.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ env.STRIPES_VERSION }}
        run: |
          gh release create $env:V dist/Stripes.exe dist/Stripes.exe.sha256 dist/version.txt --target "${{ github.sha }}" --title "Stripes $env:V" --generate-notes --prerelease
          if ($LASTEXITCODE) { exit 1 }
          # Point the beta channel at it: beta PCs read beta/version.txt, then download from the release above
          gh release view beta *> $null
          if ($LASTEXITCODE) {
            gh release create beta dist/version.txt --target "${{ github.sha }}" --prerelease --title "Beta channel" --notes "Holds the version beta PCs should run. Don't delete."
          } else {
            gh release upload beta dist/version.txt --clobber
          }
          if ($LASTEXITCODE) { exit 1 }
